name: Build, test, and publish RStudio Server packages

# Compiles RStudio Server from source inside Docker, for both supported OS
# families, and produces + smoke-tests two artifacts per target OS:
#   * a system package (a relocatable .rpm on EL, a .deb on Ubuntu)
#   * a non-root, no-systemd standalone .tar.gz
#
# This drives the SAME Makefile / Dockerfiles used locally -- CI only swaps in
# `docker buildx build` + GitHub Actions layer caching via the Makefile's
# DOCKER_BUILD / BUILD_FLAGS hooks. Locally those default to plain
# `sudo docker build`, so `make all` behaves identically on a workstation.
#
# Artifacts are uploaded as GitHub Actions build artifacts on every run, and
# additionally attached to a GitHub Release on tag pushes ("v*"). This does
# NOT publish to an apt/yum package repository -- that's a separate, larger
# undertaking (hosting, signing keys, repo metadata) not covered here.

on:
  workflow_dispatch:
    inputs:
      rstudio_ref:
        description: "RStudio git tag/ref to build"
        default: "v2026.06.0+242"
      version_major:
        description: "RSTUDIO_VERSION_MAJOR"
        default: "2026"
      version_minor:
        description: "RSTUDIO_VERSION_MINOR"
        default: "06"
      version_patch:
        description: "RSTUDIO_VERSION_PATCH"
        default: "0"
      version_suffix:
        description: "RSTUDIO_VERSION_SUFFIX"
        default: "+242"
  push:
    tags:
      - "v*"

# Avoid stacking expensive builds on the same ref.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: el
            el: "10"
            ubuntu: ""
            tag: el10
            pkg_build: rpm
            pkg_test: test
          - distro: el
            el: "8"
            ubuntu: ""
            tag: el8
            pkg_build: rpm
            pkg_test: test
          - distro: ubuntu
            el: ""
            ubuntu: "24.04"
            tag: ubuntu24.04
            pkg_build: deb
            pkg_test: test-deb
          - distro: ubuntu
            el: ""
            ubuntu: "26.04"
            tag: ubuntu26.04
            pkg_build: deb
            pkg_test: test-deb

    env:
      # Target OS for this matrix leg (consumed by the Makefile's DISTRO/EL/
      # UBUNTU vars). Passing both EL and UBUNTU is harmless: the Makefile
      # only reads whichever one DISTRO's branch actually uses.
      DISTRO: ${{ matrix.distro }}
      EL: ${{ matrix.el }}
      UBUNTU: ${{ matrix.ubuntu }}
      # CI overrides for the Makefile. Local `make` does not set these and so
      # keeps using `sudo docker build` with no extra flags.
      DOCKER: docker
      DOCKER_BUILD: docker buildx build
      # Per-OS-tag cache scope so the four legs don't evict each other.
      BUILD_FLAGS: >-
        --cache-from type=gha,scope=${{ matrix.tag }}
        --cache-to type=gha,mode=max,scope=${{ matrix.tag }}
        --load
      # Build parameters: workflow_dispatch inputs win; otherwise fall back to
      # the Makefile's own defaults (the pinned v2026.06.0+242).
      RSTUDIO_GIT_REF: ${{ github.event.inputs.rstudio_ref || 'v2026.06.0+242' }}
      RSTUDIO_VERSION_MAJOR: ${{ github.event.inputs.version_major || '2026' }}
      RSTUDIO_VERSION_MINOR: ${{ github.event.inputs.version_minor || '06' }}
      RSTUDIO_VERSION_PATCH: ${{ github.event.inputs.version_patch || '0' }}
      RSTUDIO_VERSION_SUFFIX: ${{ github.event.inputs.version_suffix || '+242' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Free up runner disk space
        # The RStudio build (bundled boost, node, quarto, compiled tree) needs
        # several GB; clear large preinstalled toolchains the build doesn't use.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
          docker image prune -af || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the system package (${{ matrix.tag }})
        run: |
          make ${{ matrix.pkg_build }} \
            DISTRO="$DISTRO" EL="$EL" UBUNTU="$UBUNTU" \
            DOCKER="$DOCKER" DOCKER_BUILD="$DOCKER_BUILD" BUILD_FLAGS="$BUILD_FLAGS" \
            RSTUDIO_GIT_REF="$RSTUDIO_GIT_REF" \
            RSTUDIO_VERSION_MAJOR="$RSTUDIO_VERSION_MAJOR" \
            RSTUDIO_VERSION_MINOR="$RSTUDIO_VERSION_MINOR" \
            RSTUDIO_VERSION_PATCH="$RSTUDIO_VERSION_PATCH" \
            RSTUDIO_VERSION_SUFFIX="$RSTUDIO_VERSION_SUFFIX"

      - name: Smoke-test the system package (install + run on a clean ${{ matrix.tag }} image)
        run: |
          make ${{ matrix.pkg_test }} \
            DISTRO="$DISTRO" EL="$EL" UBUNTU="$UBUNTU" \
            DOCKER="$DOCKER" DOCKER_BUILD="$DOCKER_BUILD" BUILD_FLAGS="$BUILD_FLAGS" \
            RSTUDIO_GIT_REF="$RSTUDIO_GIT_REF" \
            RSTUDIO_VERSION_MAJOR="$RSTUDIO_VERSION_MAJOR" \
            RSTUDIO_VERSION_MINOR="$RSTUDIO_VERSION_MINOR" \
            RSTUDIO_VERSION_PATCH="$RSTUDIO_VERSION_PATCH" \
            RSTUDIO_VERSION_SUFFIX="$RSTUDIO_VERSION_SUFFIX"

      - name: Build the standalone (non-root, no-systemd) tarball
        run: |
          make standalone \
            DISTRO="$DISTRO" EL="$EL" UBUNTU="$UBUNTU" \
            DOCKER="$DOCKER" DOCKER_BUILD="$DOCKER_BUILD" BUILD_FLAGS="$BUILD_FLAGS" \
            RSTUDIO_GIT_REF="$RSTUDIO_GIT_REF" \
            RSTUDIO_VERSION_MAJOR="$RSTUDIO_VERSION_MAJOR" \
            RSTUDIO_VERSION_MINOR="$RSTUDIO_VERSION_MINOR" \
            RSTUDIO_VERSION_PATCH="$RSTUDIO_VERSION_PATCH" \
            RSTUDIO_VERSION_SUFFIX="$RSTUDIO_VERSION_SUFFIX"

      - name: Smoke-test the standalone tarball (extract + run as a non-root user)
        run: |
          make test-standalone \
            DISTRO="$DISTRO" EL="$EL" UBUNTU="$UBUNTU" \
            DOCKER="$DOCKER" DOCKER_BUILD="$DOCKER_BUILD" BUILD_FLAGS="$BUILD_FLAGS" \
            RSTUDIO_GIT_REF="$RSTUDIO_GIT_REF" \
            RSTUDIO_VERSION_MAJOR="$RSTUDIO_VERSION_MAJOR" \
            RSTUDIO_VERSION_MINOR="$RSTUDIO_VERSION_MINOR" \
            RSTUDIO_VERSION_PATCH="$RSTUDIO_VERSION_PATCH" \
            RSTUDIO_VERSION_SUFFIX="$RSTUDIO_VERSION_SUFFIX"

      - name: Show built artifacts
        run: ls -l output/${{ matrix.tag }}/

      - name: Upload system package artifact
        uses: actions/upload-artifact@v4
        with:
          name: rstudio-server-${{ matrix.pkg_build }}-${{ matrix.tag }}-${{ env.RSTUDIO_VERSION_MAJOR }}.${{ env.RSTUDIO_VERSION_MINOR }}.${{ env.RSTUDIO_VERSION_PATCH }}
          path: |
            output/${{ matrix.tag }}/*.rpm
            output/${{ matrix.tag }}/*.deb
          if-no-files-found: error
          retention-days: 14

      - name: Upload standalone tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: rstudio-server-standalone-${{ matrix.tag }}-${{ env.RSTUDIO_VERSION_MAJOR }}.${{ env.RSTUDIO_VERSION_MINOR }}.${{ env.RSTUDIO_VERSION_PATCH }}
          path: output/${{ matrix.tag }}/*-standalone.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Attach artifacts to GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: output/${{ matrix.tag }}/*
