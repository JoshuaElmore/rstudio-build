name: Build, test, and publish RStudio Server packages

# Compiles RStudio Server from source inside Docker, for both supported OS
# families, and produces + smoke-tests two artifacts per target OS:
#   * a system package (a relocatable .rpm on EL, a .deb on Ubuntu)
#   * a non-root, no-systemd standalone .tar.gz
#
# This drives the SAME Makefile / Dockerfiles used locally -- CI only swaps in
# `docker buildx build` + GitHub Actions layer caching via the Makefile's
# DOCKER_BUILD / BUILD_FLAGS hooks. Locally those default to plain
# `sudo docker build`, so `make all` behaves identically on a workstation.
#
# Artifacts are uploaded as GitHub Actions build artifacts on every run. On a
# tag push ("v*") the `release` job additionally attaches every OS family's
# artifacts to a single GitHub Release -- once, after all four legs are green.
# This does NOT publish to an apt/yum package repository -- that's a separate,
# larger undertaking (hosting, signing keys, repo metadata) not covered here.
#
# Tag convention: this repo's release tags mirror the upstream RStudio tag they
# build, e.g. `v2026.09.0+174`. The `prepare` job parses the pushed tag into
# RSTUDIO_GIT_REF + RSTUDIO_VERSION_{MAJOR,MINOR,PATCH,SUFFIX}, so the packages
# a release contains always match the tag that produced them. A tag that
# doesn't parse fails the run early rather than silently publishing packages
# labelled with the Makefile's pinned default version.

on:
  workflow_dispatch:
    inputs:
      rstudio_ref:
        description: "RStudio git tag/ref to build"
        default: "v2026.09.0+174"
      version_major:
        description: "RSTUDIO_VERSION_MAJOR"
        default: "2026"
      version_minor:
        description: "RSTUDIO_VERSION_MINOR"
        default: "09"
      version_patch:
        description: "RSTUDIO_VERSION_PATCH"
        default: "0"
      version_suffix:
        description: "RSTUDIO_VERSION_SUFFIX"
        default: "+174"
  push:
    tags:
      - "v*"

# Read-only by default; only the `release` job opts up to `contents: write`.
permissions:
  contents: read

# Avoid stacking expensive builds on the same ref.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- 0. Work out what version we are building -----------------------------
  # On workflow_dispatch, the inputs win. On a tag push there are no inputs, so
  # the version is derived from the tag name itself (see "Tag convention"
  # above). Resolved once here rather than in each matrix leg so the build legs
  # and the release job cannot disagree about what they are building.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      rstudio_ref: ${{ steps.v.outputs.rstudio_ref }}
      major: ${{ steps.v.outputs.major }}
      minor: ${{ steps.v.outputs.minor }}
      patch: ${{ steps.v.outputs.patch }}
      suffix: ${{ steps.v.outputs.suffix }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Resolve build version
        id: v
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.ref_name }}
          IN_REF: ${{ github.event.inputs.rstudio_ref }}
          IN_MAJOR: ${{ github.event.inputs.version_major }}
          IN_MINOR: ${{ github.event.inputs.version_minor }}
          IN_PATCH: ${{ github.event.inputs.version_patch }}
          IN_SUFFIX: ${{ github.event.inputs.version_suffix }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            ref="$IN_REF"; major="$IN_MAJOR"; minor="$IN_MINOR"
            patch="$IN_PATCH"; suffix="$IN_SUFFIX"
          else
            # Tag push: "v2026.09.0+174" -> ref=v2026.09.0+174, 2026 / 09 / 0 / +174
            ref="$TAG_NAME"
            rest="${TAG_NAME#v}"
            suffix=""
            case "$rest" in
              *+*) suffix="+${rest#*+}"; rest="${rest%%+*}" ;;
            esac
            # Reject anything that isn't exactly major.minor.patch before
            # splitting, so e.g. "v2026.09" can't quietly yield patch=09.
            if ! printf '%s' "$rest" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::Cannot parse a version out of '$TAG_NAME'. Expected a tag like v2026.09.0+174."
              exit 1
            fi
            major="${rest%%.*}"; rest="${rest#*.}"
            minor="${rest%%.*}"; patch="${rest#*.}"
          fi

          # Refuse to build (and later publish) anything we could not parse
          # into the exact fields the Makefile expects. The suffix is the
          # upstream build number ("+174"); the Makefile turns it into the
          # package release field, so it must be empty or +<digits>.
          if ! printf '%s' "$major.$minor.$patch" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version '$major.$minor.$patch' is not major.minor.patch."
            exit 1
          fi
          if [ -n "$suffix" ] && ! printf '%s' "$suffix" | grep -Eq '^\+[0-9]+$'; then
            echo "::error::Version suffix '$suffix' is not a build number like +174."
            exit 1
          fi

          {
            echo "rstudio_ref=$ref"
            echo "major=$major"
            echo "minor=$minor"
            echo "patch=$patch"
            echo "suffix=$suffix"
            echo "version=$major.$minor.$patch"
          } >> "$GITHUB_OUTPUT"

          echo "Building RStudio $major.$minor.$patch$suffix from ref $ref"

  # ---- 1. Compile, package, and smoke-test, once per target OS --------------
  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: el
            el: "10"
            ubuntu: ""
            tag: el10
            pkg_build: rpm
            pkg_test: test
          - distro: el
            el: "8"
            ubuntu: ""
            tag: el8
            pkg_build: rpm
            pkg_test: test
          - distro: ubuntu
            el: ""
            ubuntu: "24.04"
            tag: ubuntu24.04
            pkg_build: deb
            pkg_test: test-deb
          - distro: ubuntu
            el: ""
            ubuntu: "26.04"
            tag: ubuntu26.04
            pkg_build: deb
            pkg_test: test-deb

    env:
      # Target OS for this matrix leg (consumed by the Makefile's DISTRO/EL/
      # UBUNTU vars). Passing both EL and UBUNTU is harmless: the Makefile
      # only reads whichever one DISTRO's branch actually uses.
      DISTRO: ${{ matrix.distro }}
      EL: ${{ matrix.el }}
      UBUNTU: ${{ matrix.ubuntu }}
      # CI overrides for the Makefile. Local `make` does not set these and so
      # keeps using `sudo docker build` with no extra flags.
      DOCKER: docker
      DOCKER_BUILD: docker buildx build
      # Per-OS-tag cache scope so the four legs don't evict each other.
      BUILD_FLAGS: >-
        --cache-from type=gha,scope=${{ matrix.tag }}
        --cache-to type=gha,mode=max,scope=${{ matrix.tag }}
        --load
      # Build parameters, resolved once by the `prepare` job above.
      RSTUDIO_GIT_REF: ${{ needs.prepare.outputs.rstudio_ref }}
      RSTUDIO_VERSION_MAJOR: ${{ needs.prepare.outputs.major }}
      RSTUDIO_VERSION_MINOR: ${{ needs.prepare.outputs.minor }}
      RSTUDIO_VERSION_PATCH: ${{ needs.prepare.outputs.patch }}
      RSTUDIO_VERSION_SUFFIX: ${{ needs.prepare.outputs.suffix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Free up runner disk space
        # The RStudio build (bundled boost, node, quarto, compiled tree) needs
        # several GB; clear large preinstalled toolchains the build doesn't use.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
          docker image prune -af || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # Skip the post-job builder teardown. This runner is ephemeral, so
          # the builder dies with the VM regardless -- and deleting the
          # multi-GB BuildKit state volume was timing out ("context deadline
          # exceeded"), failing `docker buildx rm` and warning the job.
          cleanup: false

      - name: Build the system package (${{ matrix.tag }})
        run: |
          make ${{ matrix.pkg_build }} \
            DISTRO="$DISTRO" EL="$EL" UBUNTU="$UBUNTU" \
            DOCKER="$DOCKER" DOCKER_BUILD="$DOCKER_BUILD" BUILD_FLAGS="$BUILD_FLAGS" \
            RSTUDIO_GIT_REF="$RSTUDIO_GIT_REF" \
            RSTUDIO_VERSION_MAJOR="$RSTUDIO_VERSION_MAJOR" \
            RSTUDIO_VERSION_MINOR="$RSTUDIO_VERSION_MINOR" \
            RSTUDIO_VERSION_PATCH="$RSTUDIO_VERSION_PATCH" \
            RSTUDIO_VERSION_SUFFIX="$RSTUDIO_VERSION_SUFFIX"

      - name: Smoke-test the system package (install + run on a clean ${{ matrix.tag }} image)
        run: |
          make ${{ matrix.pkg_test }} \
            DISTRO="$DISTRO" EL="$EL" UBUNTU="$UBUNTU" \
            DOCKER="$DOCKER" DOCKER_BUILD="$DOCKER_BUILD" BUILD_FLAGS="$BUILD_FLAGS" \
            RSTUDIO_GIT_REF="$RSTUDIO_GIT_REF" \
            RSTUDIO_VERSION_MAJOR="$RSTUDIO_VERSION_MAJOR" \
            RSTUDIO_VERSION_MINOR="$RSTUDIO_VERSION_MINOR" \
            RSTUDIO_VERSION_PATCH="$RSTUDIO_VERSION_PATCH" \
            RSTUDIO_VERSION_SUFFIX="$RSTUDIO_VERSION_SUFFIX"

      - name: Build the standalone (non-root, no-systemd) tarball
        run: |
          make standalone \
            DISTRO="$DISTRO" EL="$EL" UBUNTU="$UBUNTU" \
            DOCKER="$DOCKER" DOCKER_BUILD="$DOCKER_BUILD" BUILD_FLAGS="$BUILD_FLAGS" \
            RSTUDIO_GIT_REF="$RSTUDIO_GIT_REF" \
            RSTUDIO_VERSION_MAJOR="$RSTUDIO_VERSION_MAJOR" \
            RSTUDIO_VERSION_MINOR="$RSTUDIO_VERSION_MINOR" \
            RSTUDIO_VERSION_PATCH="$RSTUDIO_VERSION_PATCH" \
            RSTUDIO_VERSION_SUFFIX="$RSTUDIO_VERSION_SUFFIX"

      - name: Smoke-test the standalone tarball (extract + run as a non-root user)
        run: |
          make test-standalone \
            DISTRO="$DISTRO" EL="$EL" UBUNTU="$UBUNTU" \
            DOCKER="$DOCKER" DOCKER_BUILD="$DOCKER_BUILD" BUILD_FLAGS="$BUILD_FLAGS" \
            RSTUDIO_GIT_REF="$RSTUDIO_GIT_REF" \
            RSTUDIO_VERSION_MAJOR="$RSTUDIO_VERSION_MAJOR" \
            RSTUDIO_VERSION_MINOR="$RSTUDIO_VERSION_MINOR" \
            RSTUDIO_VERSION_PATCH="$RSTUDIO_VERSION_PATCH" \
            RSTUDIO_VERSION_SUFFIX="$RSTUDIO_VERSION_SUFFIX"

      - name: Show built artifacts
        run: ls -l output/${{ matrix.tag }}/

      - name: Upload system package artifact
        uses: actions/upload-artifact@v7
        with:
          name: rstudio-server-${{ matrix.pkg_build }}-${{ matrix.tag }}-${{ needs.prepare.outputs.version }}
          path: |
            output/${{ matrix.tag }}/*.rpm
            output/${{ matrix.tag }}/*.deb
          if-no-files-found: error
          retention-days: 14

      - name: Upload standalone tarball artifact
        uses: actions/upload-artifact@v7
        with:
          name: rstudio-server-standalone-${{ matrix.tag }}-${{ needs.prepare.outputs.version }}
          path: output/${{ matrix.tag }}/*-standalone.tar.gz
          if-no-files-found: error
          retention-days: 14

  # ---- 2. Publish one release with every OS's artifacts ---------------------
  # Runs only for tag pushes, and only once every build leg has passed -- so a
  # release never contains a partial set of packages. This is also the only job
  # granted write access to the repository.
  release:
    needs: [prepare, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: rstudio-server-*
          merge-multiple: true

      - name: List release payload
        run: ls -l dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: RStudio Server ${{ needs.prepare.outputs.version }}${{ needs.prepare.outputs.suffix }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
